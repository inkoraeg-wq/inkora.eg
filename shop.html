<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INKORA | المتجر</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">INKORA</div>
        <nav>
            <a href="index.html">الرئيسية</a>
            <a href="shop.html" class="active">المتجر 🛒</a>
        </nav>
    </header>

    <div class="shop-header">
        <h1>تشكيلة INKORA</h1>
        <p>اختر منتجك المفضل الآن</p>
    </div>

    <main class="products-container">

        <!-- المنتج الأول -->
        <div class="product-card">
            <div class="product-image">
                <img src="tshirt1.png" alt="T-Shirt 1">
            </div>
            <div class="product-info">
                <h3 class="product-title">INKORA Black T-Shirt</h3>
                <p class="product-price">450 EGP</p>
                <button class="btn-add-cart">إضافة للسلة</button>
            </div>
        </div>

        <!-- المنتج الثاني -->
        <div class="product-card">
            <div class="product-image">
                <img src="hoodie1.png" alt="Hoodie 1">
            </div>
            <div class="product-info">
                <h3 class="product-title">INKORA Street Hoodie</h3>
                <p class="product-price">850 EGP</p>
                <button class="btn-add-cart">إضافة للسلة</button>
            </div>
        </div>

        <!-- المنتج الثالث -->
        <div class="product-card">
            <div class="product-image">
                <img src="hoodie2.png" alt="Hoodie 2">
            </div>
            <div class="product-info">
                <h3 class="product-title">INKORA Dark Edition Hoodie</h3>
                <p class="product-price">900 EGP</p>
                <button class="btn-add-cart">إضافة للسلة</button>
            </div>
        </div>

        <!-- المنتج الرابع -->
        <div class="product-card">
            <div class="product-image">
                <img src="hand1.png" alt="Hand Access">
            </div>
            <div class="product-info">
                <h3 class="product-title">INKORA Signature Gloves</h3>
                <p class="product-price">300 EGP</p>
                <button class="btn-add-cart">إضافة للسلة</button>
            </div>
        </div>

    </main>

</body>
</html>
